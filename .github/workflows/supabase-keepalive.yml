# Keeps the free-tier Supabase project active (avoids inactivity pausing).
# See docs/infrastructure.md → "Supabase keep-alive".

name: Supabase keep-alive

on:
  schedule:
    # Twice daily UTC — Supabase looks for activity over the prior ~7 days.
    - cron: "0 8,20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch Postgres via REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Missing secrets. Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          base="${SUPABASE_URL%/}"
          url="${base}/rest/v1/waitlist_signups?select=id&limit=1"

          http_code="$(
            curl -sS -o /tmp/supabase_keepalive_body -w "%{http_code}" \
              -G "${url}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          )"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Supabase keep-alive failed (HTTP ${http_code})"
            cat /tmp/supabase_keepalive_body
            exit 1
          fi

          echo "Supabase keep-alive OK (HTTP ${http_code})"
